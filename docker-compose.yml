version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: splicers-db
    environment:
      POSTGRES_USER: splicers_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: splicers
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
